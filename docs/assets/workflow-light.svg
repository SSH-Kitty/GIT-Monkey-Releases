<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1280" height="340" rx="24" fill="#f7f5ee"/>
<rect x="24" y="24" width="776" height="292" rx="20" fill="none" stroke="#d9d4c3" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="48" y="64" font-size="15" font-weight="700" letter-spacing="2" fill="#5d6678">ON YOUR COMPUTER</text>
<rect x="848" y="24" width="408" height="292" rx="20" fill="none" stroke="#d9d4c3" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="872" y="64" font-size="15" font-weight="700" letter-spacing="2" fill="#5d6678">ON GITHUB</text>
<g transform="translate(48 112)"><rect width="196" height="150" rx="16" fill="#ffffff" stroke="#d9d4c3" stroke-width="1.5"/>
<circle cx="30" cy="32" r="15" fill="#3fae6a" fill-opacity=".18" stroke="#3fae6a" stroke-width="1.5"/><text x="30" y="37.5" text-anchor="middle" font-size="15" font-weight="700" fill="#3fae6a">1</text>
<text x="18" y="80" font-size="21" font-weight="700" fill="#1d2433">Edit</text>
<text x="18" y="106" font-size="14" fill="#5d6678">Change files in Files</text><text x="18" y="126" font-size="14" fill="#5d6678">or any editor</text></g>
<path d="M252 187H296" stroke="#5d6678" stroke-width="2.5" stroke-linecap="round"/><path d="M287 180L296 187L287 194" fill="none" stroke="#5d6678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(304 112)"><rect width="196" height="150" rx="16" fill="#ffffff" stroke="#d9d4c3" stroke-width="1.5"/>
<circle cx="30" cy="32" r="15" fill="#3fae6a" fill-opacity=".18" stroke="#3fae6a" stroke-width="1.5"/><text x="30" y="37.5" text-anchor="middle" font-size="15" font-weight="700" fill="#3fae6a">2</text>
<text x="18" y="80" font-size="21" font-weight="700" fill="#1d2433">Tick</text>
<text x="18" y="106" font-size="14" fill="#5d6678">Choose what goes in</text><text x="18" y="126" font-size="14" fill="#5d6678">the next snapshot</text></g>
<path d="M508 187H552" stroke="#5d6678" stroke-width="2.5" stroke-linecap="round"/><path d="M543 180L552 187L543 194" fill="none" stroke="#5d6678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(560 112)"><rect width="196" height="150" rx="16" fill="#ffffff" stroke="#d9d4c3" stroke-width="1.5"/>
<circle cx="30" cy="32" r="15" fill="#3fae6a" fill-opacity=".18" stroke="#3fae6a" stroke-width="1.5"/><text x="30" y="37.5" text-anchor="middle" font-size="15" font-weight="700" fill="#3fae6a">3</text>
<text x="18" y="80" font-size="21" font-weight="700" fill="#1d2433">Commit</text>
<text x="18" y="106" font-size="14" fill="#5d6678">Save the snapshot</text><text x="18" y="126" font-size="14" fill="#5d6678">with a short summary</text></g>
<g transform="translate(944 112)"><rect width="276" height="150" rx="16" fill="#ffffff" stroke="#d9d4c3" stroke-width="1.5"/>
<circle cx="30" cy="32" r="15" fill="#e8a33d" fill-opacity=".18" stroke="#e8a33d" stroke-width="1.5"/><text x="30" y="37.5" text-anchor="middle" font-size="15" font-weight="700" fill="#e8a33d">4</text>
<text x="18" y="80" font-size="21" font-weight="700" fill="#1d2433">Your repository</text>
<text x="18" y="106" font-size="14" fill="#5d6678">Backed up, shared with your team,</text><text x="18" y="126" font-size="14" fill="#5d6678">with pull requests, issues and Actions</text></g>
<path d="M764 150H936" stroke="#e8a33d" stroke-width="2.5" stroke-linecap="round"/><path d="M927 143L936 150L927 157" fill="none" stroke="#e8a33d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="850" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#e8a33d">Push</text>
<path d="M936 226H764" stroke="#4d8fd6" stroke-width="2.5" stroke-linecap="round"/><path d="M773 219L764 226L773 233" fill="none" stroke="#4d8fd6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="850" y="254" text-anchor="middle" font-size="16" font-weight="700" fill="#4d8fd6">Pull</text>
<text x="48" y="296" font-size="14" fill="#5d6678">Commits stay on your computer until you push. Pull brings your teammates' commits down.</text>
</svg>
